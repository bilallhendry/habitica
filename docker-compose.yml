version: "3"

services:
  mongo:
    image: docker.io/mongo:6
    restart: unless-stopped
    command: ["--replSet", "rs", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks:
      - habitica
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10

  server:
    image: docker.io/awinterstein/habitica-server:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - habitica
    environment:
      - NODE_DB_URI=mongodb://mongo/habitica?replicaSet=rs
      - BASE_URL=https://habitica.malaysiawest.cloudapp.azure.com
      - INVITE_ONLY=true

  caddy:
    image: docker.io/caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - habitica

networks:
  habitica:

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
